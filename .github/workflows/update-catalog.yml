name: Update production card catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,11,19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download official Pokémon TCG bulk data
        uses: actions/checkout@v6
        with:
          repository: PokemonTCG/pokemon-tcg-data
          path: PokemonTCGData
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download previous known-good release
        run: |
          mkdir -p /tmp/cardvault-previous
          curl --fail --location --retry 4 \
            https://nelgabpr.github.io/cardvault-catalog/catalog.json \
            --output /tmp/cardvault-previous/catalog.json || true
          curl --fail --location --retry 4 \
            https://nelgabpr.github.io/cardvault-catalog/manifest.json \
            --output /tmp/cardvault-previous/manifest.json || true
      - name: Run catalog resilience tests
        run: python -m unittest Tools/test_build_catalog.py
      - name: Build validated catalog snapshot
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
        run: |
          source_revision="$(git -C PokemonTCGData rev-parse HEAD)"
          python Tools/build_catalog.py \
            --catalog CatalogHosting/catalog.json \
            --manifest CatalogHosting/manifest.json \
            --catalog-path catalog.json \
            --source-directory PokemonTCGData/cards/en \
            --sets-file PokemonTCGData/sets/en.json \
            --enrich-prices \
            --source-revision "$source_revision" \
            --previous-catalog /tmp/cardvault-previous/catalog.json \
            --health-report CatalogHosting/health.json
      - name: Sign catalog snapshot
        env:
          CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY }}
        run: |
          python -m pip install "cryptography==45.0.6"
          python Tools/sign_catalog.py \
            --catalog CatalogHosting/catalog.json \
            --manifest CatalogHosting/manifest.json
      - name: Publish immutable and rollback artifacts
        run: |
          current_version="$(jq -r .catalogVersion CatalogHosting/manifest.json)"
          current_path="versions/${current_version}/catalog.json"
          mkdir -p "CatalogHosting/versions/${current_version}"
          cp CatalogHosting/catalog.json "CatalogHosting/${current_path}"
          jq --arg path "$current_path" '.catalogPath = $path' \
            CatalogHosting/manifest.json > CatalogHosting/manifest.next.json
          mv CatalogHosting/manifest.next.json CatalogHosting/manifest.json

          if [ -s /tmp/cardvault-previous/catalog.json ] && [ -s /tmp/cardvault-previous/manifest.json ]; then
            previous_version="$(jq -r .catalogVersion /tmp/cardvault-previous/manifest.json)"
            mkdir -p "CatalogHosting/versions/${previous_version}"
            cp /tmp/cardvault-previous/catalog.json "CatalogHosting/versions/${previous_version}/catalog.json"
            cp /tmp/cardvault-previous/manifest.json CatalogHosting/rollback-manifest.json
          fi
      - name: Upload catalog health report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health
          path: CatalogHosting/health.json
      - name: Add static hosting metadata
        run: |
          touch CatalogHosting/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: CatalogHosting

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production catalog
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed manifest and payload
        run: |
          base="https://nelgabpr.github.io/cardvault-catalog"
          curl --fail --location --retry 8 --retry-delay 5 "$base/manifest.json" --output /tmp/manifest.json
          path="$(jq -r .catalogPath /tmp/manifest.json)"
          expected="$(jq -r .sha256 /tmp/manifest.json)"
          curl --fail --location --retry 8 --retry-delay 5 "$base/$path" --output /tmp/catalog.json
          actual="$(sha256sum /tmp/catalog.json | cut -d' ' -f1)"
          test "$actual" = "$expected"
          test "$(jq -r .schemaVersion /tmp/manifest.json)" = "2"
          test "$(jq -r .signature /tmp/manifest.json)" != "null"
          curl --fail --location --retry 8 --retry-delay 5 "$base/health.json" --output /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" != "failed"
